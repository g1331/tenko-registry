[project]
name = "tenko-registry"
version = "0.1.0"
description = "Tenko 插件目录：生成并发布 index.json"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "packaging>=24.2",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
