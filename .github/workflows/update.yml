name: update

# 每天发现新版本并重测。会安装第三方代码的 refresh job 只有只读权限，
# 只有不运行插件代码的 commit job 才能写 main。
# 手动触发：gh workflow run update.yml -R g1331/tenko-registry
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: registry-write
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - name: 发现新版本
        run: uv run python -m registry discover
      - name: 重测最新版本
        run: uv run python -m registry retest
      # 重测中途失败也要保留已经写下的结果（retest 逐个插件落盘）。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: plugins
          path: plugins
          include-hidden-files: true # 没有插件时目录里只有 .gitkeep，避免产物为空
          retention-days: 1

  commit:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugins
          path: out
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: 校验后提交
        run: |
          # 只接受 JSON 数据文件；先完整校验，通过才提交。
          cp -f out/*.json plugins/ 2>/dev/null || true
          uv sync --locked
          uv run python -m registry build --out "$RUNNER_TEMP/dist"
          if [ -n "$(git status --porcelain plugins)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins
            git commit -m "chore(registry): 更新版本与测试结果"
            git push origin HEAD:main
          fi
